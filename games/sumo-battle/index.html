<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>相撲押し出しバトル | devin-games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- スタート画面 -->
<div id="startScreen" class="overlay">
  <div class="panel">
    <div class="emoji-title">🤼</div>
    <h1>相撲押し出しバトル</h1>
    <p class="catch">土俵から相手を押し出せ！先に3本取ったほうの勝ち。</p>

    <div class="names">
      <div class="name-field">
        <label for="name1">プレイヤー1</label>
        <input id="name1" type="text" maxlength="12" value="koto" autocomplete="off">
      </div>
      <div class="vs">VS</div>
      <div class="name-field">
        <label for="name2">プレイヤー2</label>
        <input id="name2" type="text" maxlength="12" value="zuza" autocomplete="off">
      </div>
    </div>

    <div class="controls-grid">
      <div class="ctl p1">
        <span class="who">P1</span>
        <span class="keys">W A S D</span> 移動
        <span class="keys">F / Space</span> 突っ張り
      </div>
      <div class="ctl p2">
        <span class="who">P2</span>
        <span class="keys">矢印キー</span> 移動
        <span class="keys">Enter / 右Shift</span> 突っ張り
      </div>
    </div>
    <p class="hint">長くぶつかると「組み合い」！ 力の押し合いで土俵際へ運ぼう。組み合い中の突っ張りは一発押し。<br class="sp">スマホ・タブレットは自動で画面分割タッチ操作になるよ。</p>

    <button id="startBtn" class="big-btn">対戦スタート</button>
    <a class="back" href="../../index.html">← ゲーム一覧にもどる</a>
  </div>
</div>

<!-- リザルト画面 -->
<div id="endScreen" class="overlay hidden">
  <div class="panel">
    <div class="emoji-title">🏆</div>
    <h1 id="winnerText"></h1>
    <p id="finalScore" class="catch"></p>
    <p id="loserNote" class="loser-note"></p>
    <button id="rematchBtn" class="big-btn">もう一度対戦</button>
    <button id="renameBtn" class="sub-btn">名前をかえて対戦</button>
  </div>
</div>

<!-- 右上トグル -->
<div id="cornerBtns">
  <button id="touchToggle" title="タッチ操作の切り替え">📱</button>
  <button id="muteBtn" title="音 ON/OFF">🔊</button>
</div>

<script src="game.js"></script>
</body>
</html>
